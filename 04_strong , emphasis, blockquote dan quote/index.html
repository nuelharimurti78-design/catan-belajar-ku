
<!DOCTYPE html>
<html>
<head>
    
    <title>strong, emphasis, dan blockquote</title>
</head>
    <body>
        <!-- strong -->
        <p> <strong>perhatian:</strong>jangan buang sampah sembarangan.
        </p>
         <!-- blockquote -->

         <blockquote>
          disana kembali kesini 
         </blockquote>
        <!-- emphasis -->
         <!-- quote -->
         <p>
            ini adalah tempat <em>nongkrong</em>  bukan tempat buat <strong>berantam</strong>. <q>slalu jaga kesehatan</q>
         </p>
    </body>
</html>
