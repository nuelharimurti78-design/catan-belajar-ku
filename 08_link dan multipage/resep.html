<DOCTYPE html>
<html>
   <head>
    <title>belajar tentang list</title>
   </head>
   <body>
    <!-- list yang ada urutan (ordered list) -->
    <h4>ordered list</h4>
    <ol>
        <!-- list item -->
         <li>test 1</li>
         <li>test 2</li>
    </ol>

    <!-- list yang tidak ada urutannya (unordered list) -->
     <h4>unordered</h4>
     <ul>
        <li>test 1</li>
        <li>test 2</li>
     </ul>

     <!-- definition list -->
      <h4>definition list</h4>
      <dl>
        <dt>siapkan pasta</dt>
        <dd>rebuslah sampai melunak.</dd>
      </dl>
   </body>
</html>
